name: regime-radar daily

# 22:30 UTC Sunday to Thursday = 05:30 WIB Monday to Friday, after the US close
# and before the IDX opens. Days 0-4 rather than 1-5 because the Monday WIB run
# happens on Sunday UTC.
# push (paths): rebuild whenever the tool or this workflow changes.
# workflow_dispatch: run by hand from the Actions tab.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the data
# commit below cannot loop, but it also does not redeploy Pages on its own.
# The last step starts hugo.yaml through workflow_dispatch, which is the one
# event GITHUB_TOKEN is allowed to trigger.

on:
  schedule:
    - cron: "30 22 * * 0-4"
  push:
    branches: [main]
    paths:
      - "tools/regime_radar/**"
      - ".github/workflows/regime-radar.yaml"
  workflow_dispatch: {}

permissions:
  contents: write # push the refreshed data
  actions: write # start hugo.yaml after the push

concurrency:
  group: regime-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/regime_radar/requirements.txt
            tools/regime_radar/requirements-dev.txt

      - name: Install deps
        run: pip install -r tools/regime_radar/requirements.txt -r tools/regime_radar/requirements-dev.txt

      # Broken signal code should never reach the public page.
      - name: Test
        run: python -m pytest tools/regime_radar/tests -q

      # One failing ticker must not block the others, so this step may fail
      # without stopping the job. The last step turns the run red afterwards.
      - name: Build payloads
        id: build
        continue-on-error: true
        run: python -m tools.regime_radar.build

      - name: Commit & push (only if data changed)
        id: commit
        run: |
          # Stage first, then check the staged diff. Plain `git diff` ignores
          # untracked files, which is why the first JSON was never committed.
          git add static/data/regime-radar/
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: regime-radar refresh ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy (hugo.yaml)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yaml --ref main --repo "${{ github.repository }}"

      - name: Fail the run if any ticker failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::At least one ticker failed. The others were published; see the Build payloads log."
          exit 1
