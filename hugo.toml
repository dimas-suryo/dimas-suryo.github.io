baseURL = 'https://dimassuryo.com/'
locale = 'en-US'
title = 'Dimas Suryo'
disableKinds = ['taxonomy', 'term']

[params]
  tagline = 'Ultra-Cyclist | Reader & Writer'
  description = "Dimas Suryo's personal site."

  # Homepage: curated lists, shown in this order. `page` is the content path,
  # `note` is an optional one-liner under the title. Everything else stays in
  # /blog/ and /projects/. Remove a block to hide it; leave a list empty to
  # fall back to "5 newest".
  [[params.home.writing]]
    page = "/blog/the-machine"
    note = "Why individually good people add up to a bad world, starting from a traffic jam on TB Simatupang."
  [[params.home.writing]]
    page = "/blog/noble-goals-broken-vessels"
    note = "Hayek's knowledge problem, state capacity, and what a superintelligent planner would change."
  [[params.home.writing]]
    page = "/blog/cigarettes"
    note = "What Indonesia's smoking habit costs the people who never lit up, in lives and in rupiah."
  # Add once the title change is live:
  # [[params.home.writing]]
  #   page = "/blog/diego"
  #   note = "Short fiction: Jakarta, 2045, and a man who turns down a perfect simulation."

  [[params.home.projects]]
    page = "/projects/regime-radar"
    note = "Daily trend and volatility regimes for IHSG, the S&P 500 and USD/IDR, from two rules you can check by hand."

[menu]
  [[menu.main]]
    name = "About"
    url = "/#about"
    weight = 1
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[menu.main]]
    name = "Now"
    url = "/now/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
