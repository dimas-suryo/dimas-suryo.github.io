{{ define "main" }}
<main>
  <article>
    <header style="margin-bottom: 30px;">
      <h1>{{ .Title }}</h1>
      {{ if and .Date (not .Params.hideDate) }}
      <p style="opacity: 0.6; font-size: 0.9em;">{{ .Date.Format "2 January 2006" }}</p>
      {{ end }}
    </header>

    <section>
      {{ .Content }}
    </section>
  </article>
</main>
{{ end }}
